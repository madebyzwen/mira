# MIRA Shelly-Logger – eigener Stack für Portainer (Homeserver)
#
# Anleitung: shelly-logger/README.md, Abschnitt „Inbetriebnahme“.
#
# Der Logger läuft unabhängig von MIRA und vom KI-Server und erfasst den Stromverbrauch
# über den Shelly Plug (lokale HTTP-API, nur lesend). Netze:
# - „server“ (vorhandenes macvlan-Netz, wie MIRA): eigene feste IP <LOGGER_IP> im Server-Netz.
#   Nur darüber erreicht der Logger den Shelly. In der Firewall genau eine Regel:
#   <LOGGER_IP> → <SHELLY_IP>, TCP 80. Auf dieser Adresse ist KEIN Port offen.
# - „mira-intern“ (internal: true, festes Subnetz): Nur hier lauscht die Lese-API
#   (LOGGER_HOST = feste Adresse in diesem Netz). MIRA tritt diesem Netz in Stufe 4b bei.
# Es werden keine Ports veröffentlicht.
#
# Erwartete Ordnerstruktur unter LOGGER_APPDATA (gehört UID 1000):
#   data/                         Datenbank shelly-logger.db (wird angelegt)
#   data/backups/                 tägliche Sicherungen (die letzten 7)
#   secrets/shelly_password.txt   Passwort der lokalen Shelly-Oberfläche (Benutzer admin)
#   secrets/api_token.txt         Token der Lese-API (ab Logger 0.2.0; mind. 32 Zeichen, gleicher Inhalt
#                                 wie shelly_logger_token.txt bei MIRA). Fehlt die Datei, misst der
#                                 Logger weiter, die API ist aber gesperrt (nur /health antwortet).
services:
  shelly-logger:
    image: ghcr.io/madebyzwen/mira-shelly-logger:${LOGGER_VERSION:-latest}
    container_name: mira-shelly-logger
    restart: unless-stopped
    networks:
      server:
        ipv4_address: ${LOGGER_IP:?LOGGER_IP setzen (feste Adresse im Server-Netz, außerhalb des DHCP-Bereichs)}
      mira-intern:
        ipv4_address: ${LOGGER_INTERN_IP:-172.31.250.10}
    environment:
      LOGGER_SHELLY_URL: ${LOGGER_SHELLY_URL:?LOGGER_SHELLY_URL setzen, z. B. http://<SHELLY_IP>}
      # leer lassen, wenn der Shelly kein Passwort hat (nicht empfohlen)
      LOGGER_SHELLY_PASSWORD_FILE: ${LOGGER_SHELLY_PASSWORD_FILE-/secrets/shelly_password.txt}
      # 1000 (Standard) oder 2000 – ohne Codeänderung umstellbar
      LOGGER_POLL_INTERVAL_MS: ${LOGGER_POLL_INTERVAL_MS:-1000}
      LOGGER_TIMEZONE: Europe/Berlin
      # API nur im internen Netz – auf der macvlan-Adresse ist kein Port offen
      LOGGER_HOST: ${LOGGER_INTERN_IP:-172.31.250.10}
      # Zusätzlich zur Netztrennung: jede Anfrage außer /health braucht dieses Token (leer = aus)
      LOGGER_API_TOKEN_FILE: ${LOGGER_API_TOKEN_FILE-/secrets/api_token.txt}
      # Optional: zweite Kopie jeder Sicherung auf einem getrennten Speicher (Volume unten ergänzen)
      LOGGER_BACKUP_COPY_DIR: ${LOGGER_BACKUP_COPY_DIR:-}
      LOGGER_LOG_LEVEL: ${LOGGER_LOG_LEVEL:-info}
    volumes:
      - ${LOGGER_APPDATA:?LOGGER_APPDATA setzen, z. B. /volume2/…/appdata/mira-shelly-logger}/data:/data
      - ${LOGGER_APPDATA}/secrets:/secrets:ro
      # Optional für LOGGER_BACKUP_COPY_DIR=/backup-copy – Ordner auf einem anderen Volume, gehört UID 1000:
      # - /volumeX/…/mira-shelly-logger-backup:/backup-copy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Beim Stoppen Zeit lassen: laufende Abfrage abwarten, Intervall schreiben, Datenbank schließen
    stop_grace_period: 20s

networks:
  server:
    # vorhandenes macvlan-Netz des Server-VLANs (wie im MIRA-Stack; nicht durch diesen Stack angelegt)
    name: ${LOGGER_NETWORK:-macvlan_server}
    external: true
  mira-intern:
    # internes Netz ohne Verbindung nach außen; fester Name, damit der MIRA-Stack in Stufe 4b
    # als „external“ beitreten kann; festes Subnetz für die feste API-Adresse
    name: mira-intern
    internal: true
    ipam:
      config:
        - subnet: ${MIRA_INTERN_SUBNET:-172.31.250.0/28}
