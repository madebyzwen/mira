# MIRA – Weboberfläche (Phase 1) für den Betrieb auf Asgard
# Start:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  mira-web:
    build:
      context: ../frontend
    image: mira-web:0.1.0
    container_name: mira-web
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
