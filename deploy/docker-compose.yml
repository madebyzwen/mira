# MIRA – lokal aus dem Quellcode bauen und starten (Entwicklung/Tests)
#
# Für den Betrieb auf Asgard über Portainer: deploy/portainer-stack.yml
#
# Vor dem ersten Start:
#   mkdir -p deploy/appdata/data deploy/appdata/secrets
#   printf 'ein-langes-startpasswort\n' > deploy/appdata/secrets/admin_password.txt
#   docker compose -f deploy/docker-compose.yml up -d --build
# Werte wie im Portainer-Stack können in deploy/.env gesetzt werden (wird nicht versioniert).
services:
  mira:
    build:
      context: ..
    image: mira:local
    container_name: mira
    ports:
      - "${MIRA_HTTP_PORT:-8080}:8080"
    environment:
      MIRA_ADMIN_USER: ${MIRA_ADMIN_USER:-admin}
      MIRA_ADMIN_DISPLAY_NAME: ${MIRA_ADMIN_DISPLAY_NAME:-Admin}
      MIRA_ADMIN_PASSWORD_FILE: /secrets/admin_password.txt
      MIRA_TRUST_PROXY: ${MIRA_TRUST_PROXY:-false}
      MIRA_LOG_LEVEL: ${MIRA_LOG_LEVEL:-info}
      # KI-Server: optionaler Anzeigename (ohne Angabe „KI-Server“) und Verbindung zum MIRA-Agent
      MIRA_AI_SERVER_NAME: ${MIRA_AI_SERVER_NAME:-}
      MIRA_AI_SERVER_URL: ${MIRA_AI_SERVER_URL:-}
      MIRA_AI_SERVER_CERT_FINGERPRINT: ${MIRA_AI_SERVER_CERT_FINGERPRINT:-}
      MIRA_AI_SERVER_TOKEN_FILE: /secrets/ai_server_token.txt
    volumes:
      - ${MIRA_APPDATA:-./appdata}/data:/data
      - ${MIRA_APPDATA:-./appdata}/secrets:/secrets:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
