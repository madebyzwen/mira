# MIRA – Stack für Portainer (Homeserver)
#
# Nutzt das fertige Image aus der GitHub Container Registry. MIRA erhält über
# ein vorhandenes macvlan-Netz eine eigene IP im Server-Netz (dort liegt auch
# der KI-Server) – vor allem für Verbindungen von MIRA zum KI-Server. HTTPS übernimmt der
# Reverse Proxy (Nginx Proxy Manager): Er erreicht MIRA über sein Backend-Netz
# unter http://mira:80 – macvlan-Adressen sind für Bridge-Container nicht erreichbar.
#
# HTTPS-Pflicht (empfohlen, ab MIRA 0.9.0): MIRA_PUBLIC_URL auf die HTTPS-Adresse setzen und
# MIRA_TRUST_PROXY auf die Adresse des Proxys. Dann leitet http://<MIRA_IP> nur noch auf
# HTTPS um; Anmeldungen werden nur über HTTPS angenommen.
# Reihenfolge und Rückweg: docs/entwicklung/security-hardening-review.md, Abschnitt „Deployment“.
#
# In Portainer: Stacks → Add stack → Web editor → diesen Inhalt einfügen,
# darunter die Umgebungsvariablen setzen (siehe README, „Betrieb auf dem Homeserver“).
#
# Erwartete Ordnerstruktur unter MIRA_APPDATA (gehört UID 1000):
#   data/                       Datenbank (wird von MIRA angelegt)
#   data/backups/               tägliche Sicherungen der Datenbank (die letzten 7)
#   secrets/admin_password.txt  Startpasswort – nur für den allerersten Start
#   secrets/ai_server_token.txt Zugriffstoken des MIRA-Agents auf dem KI-Server
#   secrets/shelly_logger_token.txt  Token der Shelly-Logger-API (gleicher Inhalt wie
#                               api_token.txt im Logger-Stack; fehlt sie, fragt MIRA ohne Token)
services:
  mira:
    image: ghcr.io/madebyzwen/mira:${MIRA_VERSION:-latest}
    container_name: mira
    restart: unless-stopped
    networks:
      server:
        ipv4_address: ${MIRA_IP:?MIRA_IP setzen (feste Adresse im Server-Netz)}
      proxy: {}
      # internes Netz zum Shelly-Logger (ab MIRA 0.8.0, Stufe 4b) – vom Logger-Stack angelegt
      mira-intern: {}
    # Port 80 ohne Root-Rechte: erlaubt nur im Netzwerk-Namensraum dieses Containers
    sysctls:
      net.ipv4.ip_unprivileged_port_start: ${MIRA_PORT:-80}
    environment:
      # Ortszeit für die tägliche Sicherung (03:30) und die Dateinamen der Sicherungen
      TZ: ${TZ:-Europe/Berlin}
      MIRA_PORT: ${MIRA_PORT:-80}
      MIRA_ADMIN_USER: ${MIRA_ADMIN_USER:-admin}
      MIRA_ADMIN_DISPLAY_NAME: ${MIRA_ADMIN_DISPLAY_NAME:-Admin}
      MIRA_ADMIN_PASSWORD_FILE: /secrets/admin_password.txt
      # Adresse des Reverse Proxys im Proxy-Netz (möglichst feste IP, z. B. 172.20.0.5, oder ein
      # kleines Netz), damit MIRA HTTPS und die echte Client-IP erkennt. Nie „true“.
      MIRA_TRUST_PROXY: ${MIRA_TRUST_PROXY:-false}
      # HTTPS-Adresse über den Reverse Proxy, z. B. https://mira.example.org – gesetzt = HTTPS-Pflicht
      MIRA_PUBLIC_URL: ${MIRA_PUBLIC_URL:-}
      MIRA_LOG_LEVEL: ${MIRA_LOG_LEVEL:-info}
      # Prüfung auf neue Versionen bei GitHub (täglich 04:00 + erster Aufruf am Tag); false = kein Internetzugriff
      MIRA_UPDATE_CHECK: ${MIRA_UPDATE_CHECK:-true}
      # KI-Server: optionaler Anzeigename (ohne Angabe „KI-Server“) und Verbindung zum MIRA-Agent
      MIRA_AI_SERVER_NAME: ${MIRA_AI_SERVER_NAME:-}
      MIRA_AI_SERVER_URL: ${MIRA_AI_SERVER_URL:-}
      MIRA_AI_SERVER_CERT_FINGERPRINT: ${MIRA_AI_SERVER_CERT_FINGERPRINT:-}
      MIRA_AI_SERVER_TOKEN_FILE: /secrets/ai_server_token.txt
      # Shelly Plug: Messwerte vom Shelly-Logger (Lese-API nur im internen Netz).
      # Feste interne Adresse statt Container-Name: MIRA und Logger teilen sich zwei Netze
      # (macvlan und mira-intern) – der Name könnte sonst zur macvlan-Adresse aufgelöst werden,
      # auf der der Logger bewusst keinen Port öffnet. Wert = LOGGER_INTERN_IP des Logger-Stacks.
      MIRA_SHELLY_LOGGER_URL: ${MIRA_SHELLY_LOGGER_URL:-http://172.31.250.10:8090}
      # Token der Logger-API (ab MIRA 0.9.0); fehlt die Datei, fragt MIRA ohne Token
      MIRA_SHELLY_LOGGER_TOKEN_FILE: ${MIRA_SHELLY_LOGGER_TOKEN_FILE-/secrets/shelly_logger_token.txt}
      # Optional: zweite Kopie jeder Sicherung auf einem getrennten Speicher (Volume unten ergänzen)
      MIRA_BACKUP_COPY_DIR: ${MIRA_BACKUP_COPY_DIR:-}
    volumes:
      - ${MIRA_APPDATA:?MIRA_APPDATA setzen, z. B. /volume2/…/appdata/mira}/data:/data
      - ${MIRA_APPDATA}/secrets:/secrets:ro
      # Optional für MIRA_BACKUP_COPY_DIR=/backup-copy – Ordner auf einem anderen Volume, gehört UID 1000:
      # - /volumeX/…/mira-backup:/backup-copy
    read_only: true
    tmpfs:
      - /tmp
    # Keine Linux-Capabilities nötig: Port 80 über die sysctl oben, ausgehende TCP-Verbindungen
    # und (später) UDP-Broadcast für Wake-on-LAN brauchen keine Rechte
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  server:
    # vorhandenes macvlan-Netz des Server-VLANs (in Docker angelegt, nicht durch diesen Stack)
    name: ${MIRA_NETWORK:-macvlan_server}
    external: true
  proxy:
    # vorhandenes Backend-Netz des Reverse Proxys (Nginx Proxy Manager)
    name: ${MIRA_PROXY_NETWORK:-npm-server_npm_backend}
    external: true
  mira-intern:
    # internes Netz (internal: true) des Shelly-Logger-Stacks; muss vor diesem Stack existieren
    name: mira-intern
    external: true
