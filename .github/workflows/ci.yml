# MIRA – Tests, Docker-Image und Releases
#
# - Jeder Push/Pull-Request mit Code-Änderungen: Typecheck, Tests und Build aller Pakete, Prüfung der npm-Abhängigkeiten
#   (npm audit) und der beiden Images (Trivy) auf bekannte Schwachstellen
# - Ändert ein Push nur die Doku (docs/, *.md), läuft stattdessen nur der Workflow „Doku“
# - Images werden nur veröffentlicht, wenn Tests und Sicherheitsprüfung bestanden sind
# - Actions sind auf Commit-SHAs festgelegt (Kommentar = Version); Aktualisierung über Dependabot
# - Push auf main:  Image ghcr.io/madebyzwen/mira:main (+ :sha-<commit>)
# - Tag v1.2.3:     Image :1.2.3, :1.2 und :latest
#                   + GitHub-Release mit dem Installationspaket des MIRA-Agents (KI-Server)
# - Shelly-Logger (eigenes Image ghcr.io/madebyzwen/mira-shelly-logger, eigene Version):
#     Push auf main → :main (+ :sha-<commit>); Tag shelly-logger-v1.2.3 → :1.2.3, :1.2, :latest
name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'shelly-logger-v*']
    # Reine Doku-Änderungen bauen nicht (Tags sind davon ausgenommen – ein Release baut immer)
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck und Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen (ab „high“ schlägt der Lauf fehl)
        run: npm audit --audit-level=high
      - name: Benennung prüfen (KI-Server, ADR 0009)
        run: npm run check:naming
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Agent-Paket bauen (Prüfung)
        run: npm run package:agent

  security-scan:
    name: Sicherheitsprüfung der Images
    runs-on: ubuntu-24.04
    env:
      # Trivy als Image, auf Version und Digest festgelegt
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Images bauen (nicht veröffentlichen)
        run: |
          docker build -t mira:scan .
          docker build -f shelly-logger/Dockerfile -t mira-shelly-logger:scan .
      - name: Trivy – bekannte Schwachstellen (HIGH/CRITICAL mit verfügbarer Korrektur lassen den Lauf scheitern)
        run: |
          for image in mira:scan mira-shelly-logger:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore \
              --exit-code 1 --no-progress "$image"
          done
      - name: Trivy – vollständiger Bericht (nur Information)
        if: always()
        run: |
          for image in mira:scan mira-shelly-logger:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro "$TRIVY_IMAGE" image \
              --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --no-progress "$image"
          done

  image:
    name: Docker-Image
    needs: [test, security-scan]
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/shelly-logger-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=MIRA
            org.opencontainers.image.description=Management, Infrastructure, Resources & Automation
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  logger-image:
    name: Docker-Image Shelly-Logger
    needs: [test, security-scan]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/shelly-logger-v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mira-shelly-logger
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=match,pattern=shelly-logger-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=shelly-logger-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/shelly-logger-v') }}
          labels: |
            org.opencontainers.image.title=MIRA Shelly-Logger
            org.opencontainers.image.description=Erfasst den Stromverbrauch des KI-Servers über einen Shelly Plug (lokal, nur lesend)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: shelly-logger/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=shelly-logger
          cache-to: type=gha,mode=max,scope=shelly-logger

  release:
    name: Release mit Agent-Paket
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:agent
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            agent/release/*.tar.gz agent/release/*.tar.gz.sha256 \
            --title "MIRA $GITHUB_REF_NAME" \
            --generate-notes
